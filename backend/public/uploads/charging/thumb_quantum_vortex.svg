<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#B026FF" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#0a0b10" stop-opacity="1"/>
      </radialGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <rect width="300" height="400" fill="#07080c"/>
    <circle cx="150" cy="180" r="120" fill="url(#bgGlow)"/>
    <circle cx="150" cy="180" r="85" fill="none" stroke="#B026FF" stroke-width="5" stroke-dasharray="16 8" filter="url(#glow)"/>
    <circle cx="150" cy="180" r="60" fill="none" stroke="#B026FF" stroke-width="8" opacity="0.8"/>
    <circle cx="150" cy="180" r="32" fill="#B026FF" opacity="0.25"/>
    <text x="150" y="190" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#B026FF" filter="url(#glow)">⚡</text>
    <text x="150" y="325" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#ffffff">Vortex 3D</text>
    <text x="150" y="350" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#B026FF" letter-spacing="2">DYNAMIC CHARGING</text>
  </svg>