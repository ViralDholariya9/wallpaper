          <stop offset="100%" stop-color="#020006"/>
        </radialGradient>
        <linearGradient id="cyberHazeLock" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7000FF" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#000" stop-opacity="0"/>
